# Starship prompt.
#
# Symbols come from Starship's `nerd-font-symbols` preset (starship 1.26.0),
# written as \uXXXX / \UXXXXXXXX escapes so Private Use Area glyphs cannot
# silently become spaces in a diff — which happened once with pasted literals.
#
# The preset is symbols only. Everything below that is not a `symbol` /
# `read_only` / `tag_symbol` key is ours: One Dark palette, styles, cmd_duration,
# terraform workspace format, AWS expiration + profile_aliases.
#
# `[os.symbols]` from the preset is omitted: the os module is off by default
# and that table is fifty Linux distro logos this machine will never show.
#
# To refresh symbols after a Starship upgrade:
#   starship preset nerd-font-symbols
# then re-merge; do not `starship preset … -o` this file or the palette dies.
#
# Glyph names in comments are from FiraCode Nerd Font Mono Retina's cmap.

"$schema" = 'https://starship.rs/config-schema.json'

# One Dark. Atom's palette, matching the iTerm2 color preset and the Cursor
# theme so the prompt, the terminal, and the editor agree.
palette = "onedark"

[palettes.onedark]
black    = "#282c34"   # background
grey     = "#5c6370"   # comments
white    = "#abb2bf"   # default foreground
red      = "#e06c75"
orange   = "#d19a66"
yellow   = "#e5c07b"
green    = "#98c379"
cyan     = "#56b6c2"
blue     = "#61afef"
purple   = "#c678dd"

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vicmd_symbol = "[❮](purple)"   # vi normal mode; bindings are vi (see .zpreztorc)

[directory]
style = "blue"
read_only = " \U000F033E"             # md-lock
read_only_style = "red"
truncation_length = 4
truncate_to_repo = false

[git_branch]
symbol = "\uF418 "             # oct-git_branch
style = "purple"

[git_status]
style = "red"

[git_commit]
tag_symbol = " \uF412 "             # oct-tag

[cmd_duration]
# Re-enabled above a 2s threshold: terragrunt, uv sync, hk check, Rails suites.
# Nothing renders below the threshold, so fast commands are unaffected.
min_time = 2_000
style = "grey"
format = "took [$duration]($style) "

[terraform]
# Show the workspace, which the default format omits. Applies to OpenTofu too.
symbol = "\uE69A "             # seti-terraform
format = "via [$symbol$workspace $version]($style) "

[aws]
symbol = "\uF0EF "             # fa-aws
style = "orange"
# oh-my-zsh aws plugin is silenced via SHOW_AWS_PROMPT=false in 80-misc.zsh.
expiration_symbol = "\uF071 "             # fa-warning
# expiration_symbol is ours (not in the preset). Worth having with AWS SSO.

# Make production unmistakable. starship cannot style this module by profile
# name, so the loudness lives in the displayed text. Keys match exactly.
# The module stays hidden until ~/.aws/config defines the profile.
[aws.profile_aliases]
# censinet-production = "\uf071 PRODUCTION"
# censinet-prod       = "\uf071 PRODUCTION"

