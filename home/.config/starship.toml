# Starship prompt.
#
# Carried forward from the 2022 dotfiles repo, which set Nerd Font symbols but
# no colors. The One Dark palette below is the addition.
#
# ---------------------------------------------------------------------------
# Why every glyph is written as a \uXXXX escape
#
# These symbols live in the Unicode Private Use Area (E000-F8FF and F0000+).
# Pasted literally they are invisible in most editors, indistinguishable from a
# plain space in a diff, and trivially lost by any tool that touches the file --
# which is exactly what happened once here, silently blanking all 23 symbols and
# leaving a suspicious gap before the branch name.
#
# TOML basic strings support \uXXXX (4 hex digits) and \UXXXXXXXX (8 digits, for
# codepoints above U+FFFF). Escapes are pure ASCII, so they survive anything,
# and the glyph name in the trailing comment says what each one should look
# like.
#
# To verify a codepoint actually exists in the installed font:
#   python -c "from fontTools.ttLib import TTFont; \
#     f=TTFont('~/Library/Fonts/FiraCodeNerdFontMono-Retina.ttf'); \
#     print(any(0xF418 in t.cmap for t in f['cmap'].tables))"
#
# Nerd Fonts v3 relocated the Material Design range (F500-FD46 -> F0001-F1AF0),
# so five symbols from the 2022 config pointed at codepoints that no longer
# exist and rendered blank. Those are noted inline below.
# ---------------------------------------------------------------------------

"$schema" = 'https://starship.rs/config-schema.json'

# One Dark. Atom's palette, matching the iTerm2 color preset and the Cursor
# theme so the prompt, the terminal, and the editor agree.
palette = "onedark"

[palettes.onedark]
black    = "#282c34"   # background
grey     = "#5c6370"   # comments
white    = "#abb2bf"   # default foreground
red      = "#e06c75"
orange   = "#d19a66"
yellow   = "#e5c07b"
green    = "#98c379"
cyan     = "#56b6c2"
blue     = "#61afef"
purple   = "#c678dd"

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vicmd_symbol = "[❮](purple)"   # vi normal mode; bindings are vi (see .zpreztorc)

[directory]
style = "blue"
read_only = " \uf456"          # oct-lock. Was U+F83D, which v3 removed.
read_only_style = "red"
truncation_length = 4
truncate_to_repo = false

[git_branch]
symbol = "\uf418 "             # oct-git_branch
style = "purple"

[git_status]
style = "red"

[cmd_duration]
# Disabled in 2022, re-enabled because the work changed: terragrunt runs, `uv sync
# --all-packages`, `hk check`, and Rails test suites all take long enough that
# knowing after the fact is useful. Nothing renders below the threshold, so fast
# commands are unaffected.
min_time = 2_000
style = "grey"
format = "took [$duration]($style) "

[terraform]
# Show the workspace, which the default format omits. Applies to OpenTofu too
# (Brewfile.optional).
format = "via [$symbol$workspace $version]($style) "

[aws]
symbol = "\ue33d "             # dev-aws
style = "orange"
# The oh-my-zsh aws plugin also wants to show the profile; SHOW_AWS_PROMPT=false
# in .zshrc.d/80-misc.zsh turns that off so it isn't displayed twice.
#
# Shown when credentials expire. Worth having with AWS SSO, where the failure
# otherwise arrives as an opaque API error partway through a command.
expiration_symbol = "\uf071 "  # fa-warning

# Make production unmistakable.
#
# starship cannot style this module conditionally on the profile name, so the
# loudness has to live in the text itself. profile_aliases rewrites the displayed
# string and costs nothing at runtime, unlike a [custom] module, which would spawn
# a subprocess on every prompt.
#
# These are placeholders — no profiles are configured on this machine yet. Replace
# the keys with real profile names; the key must match exactly, so add one line per
# production profile rather than expecting a pattern to match.
#
# Note that the whole module stays hidden until ~/.aws/config actually defines the
# profile with credentials, a credential_process, or an SSO session. Exporting
# AWS_PROFILE alone renders nothing, so this looks broken before AWS is set up.
[aws.profile_aliases]
# censinet-production = "\uf071 PRODUCTION"
# censinet-prod       = "\uf071 PRODUCTION"

[buf]
symbol = "\uf49d "             # oct-package (buf has no dedicated glyph)

[c]
symbol = "\ue61e "             # custom-c

[conda]
symbol = "\uf10c "             # fa-circle_o

[dart]
symbol = "\ue798 "             # dev-dart

[docker_context]
symbol = "\uf308 "             # linux-docker

[elixir]
symbol = "\ue275 "             # custom-elixir

[elm]
symbol = "\ue62c "             # custom-elm

[golang]
symbol = "\ue627 "             # seti-go

[haskell]
symbol = "\ue777 "             # dev-haskell

[hg_branch]
symbol = "\uf418 "             # oct-git_branch

[java]
symbol = "\ue256 "             # dev-java
style = "red"

[julia]
symbol = "\ue624 "             # seti-julia

[memory_usage]
symbol = "\U000F035B "         # md-memory. Was U+F85A, which v3 relocated.

[nim]
symbol = "\ue841 "             # dev-nim. Was U+F6A4 (a crown); the real Nim
                               # logo is both correct and actually present.

[nix_shell]
symbol = "\uf2dc "             # fa-snowflake_o

[nodejs]
symbol = "\ue718 "             # dev-nodejs_small
style = "green"

[package]
symbol = "\uf487 "             # oct-package. Was U+F8D6, which v3 relocated.
display_private = true

[python]
symbol = "\ue235 "             # fae-python
style = "yellow"

[ruby]
# Without this, starship falls back to its default 💎 emoji — the only module not
# using a Nerd Font glyph, and unreliable besides, since iTerm2 has non-ASCII font
# fallback turned off (see docs/theming.md). This is the most-seen module in the
# censinet monorepo, whose server/ root is Ruby.
symbol = "\ue739 "             # dev-ruby
style = "red"

[rust]
symbol = "\ue7a8 "             # dev-rust

# The 2022 config also set a [spack] symbol using U+1F162 (the enclosed letter
# S), which is not a Nerd Font glyph and is absent from FiraCode. Dropped rather
# than fixed: spack is an HPC package manager, and the module only renders inside
# a spack environment.
